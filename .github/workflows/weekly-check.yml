name: Weekly check

# Mechanical drift checks for the catalog: the Vercel metrics schema, package
# versions and links. A schema change opens a pull request; everything else
# goes into one issue labelled weekly-check, which closes itself when clean.
#
# Pull requests and issues are opened by a GitHub App when the secrets
# BRONTO_COMMUNITY_BOT_APP_ID and BRONTO_COMMUNITY_BOT_PRIVATE_KEY are set (the
# app needs Contents, Pull requests and Issues: read and write). Without them the run
# falls back to GITHUB_TOKEN, which needs "Allow GitHub Actions to create and
# approve pull requests" for the pull request step.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: weekly-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_APP: ${{ secrets.BRONTO_COMMUNITY_BOT_APP_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Vercel CLI
        run: npm install --global vercel@latest

      - name: Run the checks
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
          REPORT_PATH: ${{ runner.temp }}/report.md
        run: node scripts/weekly-check.mjs

      - name: Get a GitHub App token
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BRONTO_COMMUNITY_BOT_APP_ID }}
          private-key: ${{ secrets.BRONTO_COMMUNITY_BOT_PRIVATE_KEY }}

      - name: Open or update the schema pull request
        if: steps.check.outputs.schema_changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          sign-commits: true
          branch: automation/metrics-schema
          add-paths: reference/vercel-metrics-schema.json
          commit-message: Update the Vercel metrics schema
          title: Update the Vercel metrics schema
          body-path: ${{ runner.temp }}/report.md
          labels: weekly-check
          delete-branch: true

      - name: Open, update or close the report issue
        if: always() && steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          FINDINGS: ${{ steps.check.outputs.findings }}
          REPORT: ${{ runner.temp }}/report.md
        run: |
          gh label create weekly-check --color BFD4F2 \
            --description "Opened by the weekly check" 2>/dev/null || true
          issue=$(gh issue list --label weekly-check --state open \
            --search "in:title Weekly check" --json number --jq '.[0].number // empty')
          if [ "${FINDINGS:-0}" -gt 0 ]; then
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file "$REPORT"
              gh issue comment "$issue" --body "Updated by the run on $(date -u +%F)."
            else
              gh issue create --title "Weekly check: catalog drift" \
                --label weekly-check --body-file "$REPORT"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Nothing left to report on $(date -u +%F)."
          fi
